<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekisteröidy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
    <a class="navbutton" href="index.html">etusivu</a>
    <a class="navbutton" href="gallery.html">galleria</a>
    <a class="navbutton active" href="register.html" aria-current="page">register</a>
</nav>

<h1 class="otsikko1">Rekisteröidy</h1>

<div class="container">
    <div class="card form-card">
        <p class="intro">Rekisteröidy näppäimistösivulle!</p>

        <form action="https://httpbin.org/post" method="post">
            <div class="field">
                <label for="name">Nimi</label>
                <input type="text" id="name" name="name" autocomplete="name" required>
            </div>

            <div class="field">
                <label for="email">Sähköpostiosoite</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>

            <div class="field">
                <label for="username">Käyttäjänimi</label>
                <input type="text" id="username" name="username" autocomplete="username" minlength="3" required>
            </div>

            <div class="field">
                <label for="password">Salasana</label>
                <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
            </div>

            <div class="field">
                <label for="usertype">Käyttäjätyyppi</label>
                <select id="usertype" name="usertype" required>
                    <option value="">Valitse käyttäjätyyppi</option>
                    <option value="beginner">Aloittelija</option>
                    <option value="enthusiast">Mekaanisten harrastaja</option>
                    <option value="builder">Custom-rakentaja</option>
                    <option value="collector">Keräilijä</option>
                </select>
            </div>

            <div class="field checkbox-field">
                <input type="checkbox" id="terms" name="terms" value="accepted" required>
                <label for="terms">Hyväksyn käyttöehdot</label>
            </div>

            <button type="submit" class="submit-btn">Rekisteröidy</button>
        </form>
    </div>
</div>
</body>
</html>
